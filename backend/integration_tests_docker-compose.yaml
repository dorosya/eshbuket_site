version: '3.9'

services: 
  backend:
    build:
      context: . 
      dockerfile: Dockerfile
    networks:
      - app-network
    env_file:
      - .env.tests
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      - backend
    env_file:
      - .env.tests
    networks:
      - app-network

  postgres:
    image: postgres:15
    restart: always
    env_file:
      - .env.tests
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
      start_period: 5s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_test: {}
