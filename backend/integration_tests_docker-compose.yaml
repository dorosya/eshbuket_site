services: 
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network
    env_file:
      - .env.tests
    depends_on:
      postgres:
        condition: service_healthy
  tests: 
    build: 
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      - backend
    env_file:
      - .env.tests
    networks:
      - app-network

  postgres:
    image: postgres:15
    restart: always
    env_file:
      - .env.tests
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
      start_period: 5s

  # pgadmin:
  #   image: dpage/pgadmin4
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - app-network 

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: {}