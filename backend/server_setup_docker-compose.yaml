services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./config/.env
    environment:
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./migrations:/app/migrations:ro
    networks:
      - app-network

  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ./config/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      retries: 10
      start_period: 5s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
