<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Eshbuket Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Eshbuket – управление товарами</h1>

  <section>
    <h2>Создать товар</h2>
    <input id="name" placeholder="Название" />
    <input id="price" placeholder="Цена" type="number" />
    <input id="category" placeholder="Категория" />
    <button onclick="createProduct()">Создать</button>
  </section>

  <section>
    <h2>Товары</h2>
    <ul id="products"></ul>
  </section>

  <section>
    <h2>Загрузить изображение</h2>
    <input id="productId" placeholder="ID товара" />
    <input id="image" type="file" />
    <button onclick="uploadImage()">Загрузить</button>
    <div id="preview"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
